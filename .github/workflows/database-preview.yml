name: Preview Database Migration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/operator-publication-http.integration.mjs"
      - "src/lib/directory/operator-publication-handler.mjs"
      - "src/lib/directory/operator-publication.ts"
      - "src/lib/supabase/operator-publication.mjs"
      - "scripts/preview-forward-package*"
      - "release/preview-claims/**"
      - ".github/workflows/database-preview.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: Hosted application is blocked pending target and provider approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local775-preview-database
  cancel-in-progress: false

jobs:
  database-contract:
    name: Isolated Database Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Start isolated Supabase
        run: supabase start

      - name: Test database contracts
        run: supabase test db

      - name: Test authenticated HTTP publication contract
        run: node scripts/operator-publication-http.integration.mjs

      - name: Lint local schemas
        run: supabase db lint --local --level warning --fail-on error

      - name: Stop isolated Supabase
        if: ${{ always() }}
        run: supabase stop --no-backup

  preview-migrations:
    name: Preview Forward Package (no hosted execution)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: database-contract
    runs-on: ubuntu-latest
    environment: local775-preview
    timeout-minutes: 15
    steps:
      - name: Refuse hosted application until the divergent target is approved
        if: ${{ inputs.apply }}
        run: |
          echo 'Hosted apply is disabled. Review the target-specific forward package and provider controls first.'
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare reviewed target-specific SQL without connecting
        run: node scripts/preview-forward-package.mjs dpxeldzunfxmjahgvjhm artifacts/preview-claims/forward.sql

      - name: Save forward package for review
        uses: actions/upload-artifact@v4
        with:
          name: preview-claims-forward-package
          path: artifacts/preview-claims/forward.sql
          retention-days: 7
