reviews:
  profile: assertive
  auto_review:
    enabled: false
    labels:
      - "coderabbit-review"
    drafts: false
    auto_incremental_review: false
  path_filters:
    - "!**/*.md"
    - "!**/*.mdx"
    - "!docs/**"
    - "!**/docs/**"
    - "!**/*.{png,jpg,jpeg,gif,webp,avif,svg,ico,mp4}"
    - "!src/data/journal.ts"
